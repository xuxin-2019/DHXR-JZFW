mybatis-plus:
  mapper-locations: classpath:/mapper/**/*.xml
  type-aliases-package: com.homemaker.entity
  configuration:
    map-underscore-to-camel-case: true

# 日志配置
logging:
  level:
    com.homemaker: debug
    com.baomidou.mybatisplus: info

# Swagger配置
swagger:
  enabled: true
  base-package: com.homemaker.controller

# 微信小程序配置
