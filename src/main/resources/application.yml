server:
  port: 8080
  servlet:
    context-path: /homemaker
  # SSL配置已注释，避免启动失败
  # ssl:
  #   key-store-type: 

spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/home_make_db?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: xusd1994
    driver-class-name: com.mysql.cj.jdbc.Driver
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  redis:
    host: 127.0.0.1
    port: 6379
    database: 0
    timeout: 10000
    lettuce:
      pool:
        max-active: 8
        max-wait: -1
        max-idle: 8
        min-idle: 0

mybatis-plus:
  mapper-locations: classpath:/mapper/**/*.xml
  type-aliases-package: com.homemaker.entity
  configuration:
    map-underscore-to-camel-case: true

# 日志配置
logging:
  level:
    com.homemaker: debug
    com.baomidou.mybatisplus: info

# Swagger配置
swagger:
  enabled: true
  base-package: com.homemaker.controller

# 微信小程序配置
wechat:
  mini:
    appid: wx2c30d8dbc07248f2
    secret: 4a0e4fa4032dc4b5d7ec9ce04fc611f7
  # 微信支付配置
  pay:
    # 环境切换开关：true-生产环境（调用真实微信支付接口），false-测试环境（使用模拟数据）
    isProduction: false
    # 微信支付必要参数
    appid: wx2c30d8dbc07248f2
    mchid: 1731663987
    key: hIE8MbnofrivqcdAXGZ4Sk3JRw2YlupF
    # API证书相关配置（生产环境必需）
    cert_path: /opt/wechat/cert/apiclient_cert.p12
    cert_password: 721124
    # 回调通知地址
    notify_url: https://3mqaze.top/homemaker/api/pay/notify
    refund_notify_url: https://3mqaze.top/homemaker/api/pay/refund-notify
    # APIv3配置（可选）
    api_v3_key: your_api_v3_key_here

# 登录拦截器配置
login:
  interceptor:
    # 根路径和上下文路径
    root-paths:
      - "/"
      - "/homemaker"
      - "/homemaker/"
      - ""
      - "/homemaker/index.html"
      - "/homemaker/api/service-type/list"
    # 登录相关接口和支付相关接口
    login-paths:
      - "/api/wx/login"
      - "/api/admin/login"
      - "/api/wx/validate"
      - "/api/test/"
      - "/homemaker/api/pay/notify"
      - "/homemaker/api/pay/refund-notify"
      - "/homemaker/api/payment/status"
    # 静态资源路径前缀
    static-prefixes:
      - "/static/"
      - "/swagger-ui/"
      - "/v3/api-docs/"
      - "/css/"
      - "/js/"
      - "/img/"
      - "/fonts/"
    # 静态资源文件扩展名
    static-extensions:
      - ".css"
      - ".js"
      - ".png"
      - ".jpg"
      - ".jpeg"
      - ".gif"
      - ".ico"
      - ".svg"
      - ".woff"
      - ".woff2"
      - ".ttf"
      - ".eot"
    # 特定静态资源文件
    specific-static-files:
      - "/homemaker/favicon.ico"