# 登录拦截器配置
login:
  interceptor:
    # 根路径和上下文路径
    root-paths:
      - "/"
      - "/homemaker"
      - "/homemaker/"
      - ""
      - "/homemaker/index.html"
      - "/homemaker/api/service-type/list"
      - "/homemaker/error"
      - "/error"
    # 登录相关接口和支付相关接口
    login-paths:
      - "/api/wx/login"
      - "/api/admin/login"
      - "/api/wx/validate"
      - "/api/test/"
      - "/api/payment/notify"
      - "/api/refund/notify"
      - "/api/payment/status"
    # 静态资源路径前缀
    static-prefixes:
      - "/static/"
      - "/swagger-ui/"
      - "/v3/api-docs/"
      - "/css/"
      - "/js/"
      - "/img/"
      - "/fonts/"
    # 静态资源文件扩展名
    static-extensions:
      - ".css"
      - ".js"
      - ".png"
      - ".jpg"
      - ".jpeg"
      - ".gif"
      - ".ico"
      - ".svg"
      - ".woff"
      - ".woff2"
      - ".ttf"
      - ".eot"
    # 特定静态资源文件
    specific-static-files:
      - "/homemaker/favicon.ico"