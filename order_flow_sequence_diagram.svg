<svg width="1000" height="800" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景和标题 -->
  <rect width="1000" height="800" fill="white"/>
  <text x="500" y="30" font-family="Arial" font-size="24" text-anchor="middle" fill="#333">家政服务系统订单流程时序图</text>
  
  <!-- 参与者 -->
  <g font-family="Arial" font-size="16">
    <!-- 用户 -->
    <rect x="100" y="70" width="120" height="40" rx="5" fill="#e6f3ff" stroke="#3399ff" stroke-width="2"/>
    <text x="160" y="95" text-anchor="middle" fill="#333">用户</text>
    <line x1="160" y1="110" x2="160" y2="750" stroke="#333" stroke-width="1" stroke-dasharray="5,5"/>
    
    <!-- 系统 -->
    <rect x="280" y="70" width="120" height="40" rx="5" fill="#e6ffe6" stroke="#33cc33" stroke-width="2"/>
    <text x="340" y="95" text-anchor="middle" fill="#333">系统</text>
    <line x1="340" y1="110" x2="340" y2="750" stroke="#333" stroke-width="1" stroke-dasharray="5,5"/>
    
    <!-- 管理员 -->
    <rect x="460" y="70" width="120" height="40" rx="5" fill="#fff0e6" stroke="#ff9966" stroke-width="2"/>
    <text x="520" y="95" text-anchor="middle" fill="#333">管理员</text>
    <line x1="520" y1="110" x2="520" y2="750" stroke="#333" stroke-width="1" stroke-dasharray="5,5"/>
    
    <!-- 护工 -->
    <rect x="640" y="70" width="120" height="40" rx="5" fill="#fff5e6" stroke="#ffcc66" stroke-width="2"/>
    <text x="700" y="95" text-anchor="middle" fill="#333">护工</text>
    <line x1="700" y1="110" x2="700" y2="750" stroke="#333" stroke-width="1" stroke-dasharray="5,5"/>
  </g>
  
  <!-- 时序线和事件 -->
  <g font-family="Arial" font-size="14">
    <!-- 用户下单流程 -->
    <line x1="160" y1="150" x2="340" y2="150" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
    <rect x="200" y="135" width="200" height="30" rx="5" fill="#f0f0f0"/>
    <text x="300" y="155" text-anchor="middle" font-size="12">选择服务</text>
    
    <line x1="160" y1="200" x2="340" y2="200" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
    <rect x="200" y="185" width="200" height="30" rx="5" fill="#f0f0f0"/>
    <text x="300" y="205" text-anchor="middle" font-size="12">支付</text>
    
    <line x1="340" y1="250" x2="160" y2="250" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
    <rect x="180" y="235" width="320" height="30" rx="5" fill="#e6f3ff"/>
    <text x="340" y="255" text-anchor="middle" font-size="12">生成待派单订单 (状态=1)</text>
    
    <!-- 派单流程 -->
    <line x1="340" y1="300" x2="520" y2="300" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
    <rect x="360" y="285" width="320" height="30" rx="5" fill="#f0f0f0"/>
    <text x="520" y="305" text-anchor="middle" font-size="12">显示待派单订单</text>
    
    <line x1="520" y1="350" x2="340" y2="350" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
    <rect x="360" y="335" width="320" height="30" rx="5" fill="#f0f0f0"/>
    <text x="520" y="355" text-anchor="middle" font-size="12">点击【派单】选择护工</text>
    
    <line x1="340" y1="400" x2="700" y2="400" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
    <rect x="400" y="385" width="440" height="30" rx="5" fill="#fff0e6"/>
    <text x="700" y="405" text-anchor="middle" font-size="12">通知护工 (状态=2)</text>
    
    <!-- 护工接单/拒单流程 -->
    <line x1="700" y1="450" x2="340" y2="450" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
    <rect x="440" y="435" width="220" height="30" rx="5" fill="#fff5e6"/>
    <text x="550" y="455" text-anchor="middle" font-size="12">护工接单/拒单</text>
    
    <line x1="340" y1="500" x2="160" y2="500" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
    <rect x="180" y="485" width="320" height="30" rx="5" fill="#e6f3ff"/>
    <text x="340" y="505" text-anchor="middle" font-size="12">通知用户接单结果 (状态=3/7)</text>
    
    <!-- 服务流程 -->
    <line x1="340" y1="550" x2="700" y2="550" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
    <rect x="560" y="535" width="280" height="30" rx="5" fill="#f0f0f0"/>
    <text x="700" y="555" text-anchor="middle" font-size="12">护工开始服务 (状态=4)</text>
    
    <line x1="700" y1="600" x2="340" y2="600" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
    <rect x="520" y="585" width="320" height="30" rx="5" fill="#fff5e6"/>
    <text x="680" y="605" text-anchor="middle" font-size="12">护工结束服务</text>
    
    <line x1="340" y1="650" x2="160" y2="650" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
    <rect x="180" y="635" width="320" height="30" rx="5" fill="#e6f3ff"/>
    <text x="340" y="655" text-anchor="middle" font-size="12">用户确认完成 (状态=5)</text>
    
    <!-- 评价流程 -->
    <line x1="160" y1="700" x2="340" y2="700" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
    <rect x="200" y="685" width="200" height="30" rx="5" fill="#f0f0f0"/>
    <text x="300" y="705" text-anchor="middle" font-size="12">用户评价</text>
  </g>
  
  <!-- 箭头标记定义 -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>
  
  <!-- 图例说明 -->
  <g font-family="Arial" font-size="12">
    <rect x="780" y="150" width="150" height="180" rx="5" fill="#f8f8f8" stroke="#ccc"/>
    <text x="855" y="175" text-anchor="middle" font-weight="bold">订单状态说明</text>
    <text x="800" y="200">1: 待派单</text>
    <text x="800" y="225">2: 已派单</text>
    <text x="800" y="250">3: 已接单</text>
    <text x="800" y="275">4: 服务中</text>
    <text x="800" y="300">5: 已完成</text>
    <text x="800" y="325">6: 已取消</text>
    <text x="800" y="350">7: 已拒绝</text>
  </g>
</svg>